<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>dhtmlx-effect: a plugin in a frame</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* The host of the UI: the whole window here; an app can give it any size. */
      #app { width: 100vw; height: 100vh; }
      #plugin iframe { width: 0; height: 0; border: 0; position: absolute; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="plugin"></div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
