<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>dhtmlx-effect: a plugin in a frame</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      header { padding: 8px 12px; border-bottom: 1px solid #ddd; font-size: 14px; }

    <div id="plugin"></div>
    <script type="module" src="./host.ts"></script>
  </body>
