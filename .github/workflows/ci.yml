name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test --require-browser
      - run: bun run book:build
